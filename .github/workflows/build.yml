name: Build JimHelper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Установка Gradle для генерации wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Генерируем gradlew прямо на раннере GitHub
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Сохраняем скомпилированный .jar мод в артефакты сборки
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JimHelper-1.21.4
          path: build/libs/*.jar
